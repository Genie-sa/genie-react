name: Setup
description: Install pnpm and Node, then restore dependencies from the lockfile.

inputs:
  registry-url:
    description: npm registry to authenticate against (only needed for publishing).
    required: false
    default: ""
  cache:
    description: Restore and save the pnpm store cache. Disable for jobs that install packages outside the lockfile.
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: ${{ inputs.cache == 'true' && 'pnpm' || '' }}
        registry-url: ${{ inputs.registry-url }}

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
