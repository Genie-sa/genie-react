name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Lint · Typecheck · Build · Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: |
          pnpm exec tsrs --version
          pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Verify JSON CLI transcripts
        run: node scripts/check-cli-json.mjs

      - name: Guard CLI startup cost
        run: node scripts/check-cli-startup.mjs

      - name: Typecheck Expo integration
        run: pnpm --filter @genie-react/expo-demo typecheck

      - name: Verify release artifacts
        run: pnpm check:release

      - name: Test
        run: pnpm test

      - name: Test Babel plugin on Babel 8
        run: pnpm test:babel8

      - name: Validate agent eval tasks
        run: pnpm eval --dry-run

      - name: Documentation
        run: pnpm check:docs

  vite-e2e:
    name: Vite browser to CLI E2E
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Vite E2E
        run: pnpm check:e2e

      - name: Verify interaction timeline in Chromium
        run: node scripts/check-timeline-e2e.mjs

      - name: Verify fix verdicts in Chromium
        run: node scripts/check-verify-e2e.mjs

  apps-e2e:
    name: Apps E2E · ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        app: [vite-demo, router-demo, demo, plain-demo, next-demo]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build packages
        run: pnpm build

      - name: Run ${{ matrix.app }} against the built CLI and runtime
        run: node scripts/check-apps-e2e.mjs --app ${{ matrix.app }}

  runtime-overhead:
    name: Runtime overhead guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build runtime
        run: pnpm --filter genie-react build

      - name: Guard runtime overhead against a no-Genie baseline
        run: node scripts/benchmark-runtime-overhead.mjs --guard --output "$RUNNER_TEMP/runtime-overhead.json"

      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-overhead
          path: ${{ runner.temp }}/runtime-overhead.json
          if-no-files-found: ignore

  compatibility:
    name: Compatibility · ${{ matrix.profile }} · Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: minimum
            node: 22.12.0
          - profile: current
            node: 24
          - profile: current
            node: 26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build packages
        run: pnpm build

      - name: Setup compatibility Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Verify dependency compatibility
        run: node scripts/check-compatibility.mjs --profile ${{ matrix.profile }}
