name: Deploy Docs

on:
  push:
    branches:
      - main
    paths:
      - apps/docs/**
      - pnpm-lock.yaml
      - .github/actions/setup/**
      - .github/workflows/docs-deploy.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy genie-react.com
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Check
        run: pnpm --filter @genie-react/docs check

      - name: Deploy
        working-directory: apps/docs
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Check live site
        run: pnpm --filter @genie-react/docs check:live-site
